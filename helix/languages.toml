# Python
[[language]]
name = "python"
language-servers = ["basedpyright"]
formatter = { command = "yapf"}
auto-format = true

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config]
basedpyright.analysis.autoImportCompletions = false

# C++
[[language]]
name = "cpp"
auto-format = true

# Bash
[[language]]
name = "bash"
language-servers = ["bashls"]

[language-server.bashls]
command = "bashls"

# Cmake
[[language]]
name = "cmake"
auto-format = true
language-servers = [{ name = "neocmakelsp" }]

[language-server.neocmakelsp]
command = "neocmakelsp"
args = ["stdio"]

# QML
[[language]]
name = "qml"
language-servers = ["qmlls6"]

[language-server.qmlls6]
command = "qmlls6"
